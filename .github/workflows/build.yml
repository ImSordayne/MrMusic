name: build

# 自动构建 MrMusic：
#   * push / PR  -> Windows、Linux、macOS 全量构建 + 单元自检 + 打包
#   * tag v*     -> 额外构建 Android APK，并创建 GitHub Release 附带全部产物
#   * 手动触发   -> 可指定 Qt 版本，可选是否构建 Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build against'
        required: false
        default: '6.11.1'
      build_android:
        description: 'Also build the Android arm64 APK'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: ${{ github.event.inputs.qt_version || '6.11.1' }}
  CMAKE_BUILD_TYPE: Release
  # NDK version used by the Android job (must match what Qt for Android expects)
  ANDROID_NDK_VERSION: '27.2.12479018'

jobs:
  # ===========================================================================
  # Windows x64 (首要平台)
  # ===========================================================================
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          modules: qtmultimedia
          # aqt 3.3.0 (PyPI) still assumes the pre-6.11 Windows repo
          # layout; Qt 6.11 split it into qt6_6111_msvc2022_64/.
          # Use the aqtinstall commit that adds EXTENSIONS_WIN_X64_QT6_11.
          aqtsource: https://codeload.github.com/miurahr/aqtinstall/tar.gz/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Self test
        run: build/mrmusic_selftest.exe

      - name: Install and deploy (windeployqt)
        shell: pwsh
        run: |
          cmake --install build --prefix dist
          & "${{ env.QT_ROOT_DIR }}/bin/windeployqt.exe" --release --qmldir qml "dist/bin/MrMusic.exe"
          New-Item -ItemType Directory -Force -Path "dist/bin/data" | Out-Null
          Compress-Archive -Path dist/bin -DestinationPath MrMusic-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-windows-x64
          path: MrMusic-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Linux x64 (AppImage)
  # ===========================================================================
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libglib2.0-dev \
            patchelf libfuse2 file desktop-file-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Self test
        run: QT_QPA_PLATFORM=offscreen build/mrmusic_selftest

      - name: Package AppImage
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-linux-x64-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # macOS (Apple Silicon, dmg)
  # ===========================================================================
  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Self test
        run: |
          if [ -x ./build/mrmusic_selftest.app/Contents/MacOS/mrmusic_selftest ]; then
            ./build/mrmusic_selftest.app/Contents/MacOS/mrmusic_selftest
          else
            ./build/mrmusic_selftest
          fi

      - name: Package dmg (macdeployqt)
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: bash scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Android arm64 (默认只在打 tag 或手动勾选时构建 —— 见 TARGET.md §9.14)
  # ===========================================================================
  android:
    name: Android arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_android)
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install host Qt (for Qt build tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtmultimedia
          dir: ${{ runner.temp }}/QtHost
          set-env: false
          cache: true

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/QtAndroid
          set-env: false
          cache: true

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/mrmusic.keystore
          else
            keytool -genkeypair -v -keystore android/mrmusic.keystore -alias mrmusic \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass mrmusic -keypass mrmusic -dname "CN=MrMusic"
          fi

      - name: Build APK
        run: |
          export QT_HOST_PATH="${RUNNER_TEMP}/QtHost/${QT_VERSION}/gcc_64"
          export QT_ANDROID_PATH="${RUNNER_TEMP}/QtAndroid/${QT_VERSION}/android_arm64_v8a"
          bash scripts/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-android-arm64
          path: dist/MrMusic-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Release（打 tag 时把各平台产物挂到 Release 上）
  # ===========================================================================
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [windows, linux, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: MrMusic ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/**
          generate_release_notes: true
