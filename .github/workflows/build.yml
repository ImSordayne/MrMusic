name: build

# 自动构建 MrMusic（TARGET.md §10.29）：
#   * push（main/master）/ pull_request / workflow_dispatch
#       -> Windows、Linux、macOS、Android 全量构建 + 自检 + 打包
#       -> 每次都按 VERSION 发布 Release（CHANGLOG.md 作为说明）
#   * 仅改动文档类文件时不触发；仓库中存在 NO_BUILD 时全部构建/发版 job 跳过
#   * 本地开发仍遵守 §9.14：不主动构建 Android APK

on:
  push:
    branches: [main, master]
    # GitHub paths-ignore: 只有当本次 push 的「所有」变更文件都命中时才跳过。
    # 与代码同批提交的文档不会让工作流跳过（正是期望行为）。
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'TARGET.md'
      - 'PERSONAL.md'
      - 'API_ENDPOINTS.md'
      - 'VERSION'
      - 'CHANGLOG.md'
      - 'CHANGELOG.md'
      - 'NO_BUILD'
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'TARGET.md'
      - 'PERSONAL.md'
      - 'API_ENDPOINTS.md'
      - 'VERSION'
      - 'CHANGLOG.md'
      - 'CHANGELOG.md'
      - 'NO_BUILD'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version to build against'
        required: false
        default: '6.11.1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  QT_VERSION: ${{ github.event.inputs.qt_version || '6.11.1' }}
  CMAKE_BUILD_TYPE: Release
  # NDK version used by the Android job (must match what Qt for Android expects)
  ANDROID_NDK_VERSION: '27.2.12479018'

jobs:
  # ===========================================================================
  # Gate: NO_BUILD is a repository file, so it cannot be evaluated in `on:`.
  # This job checks it out and exposes an output; every real job depends on it.
  # ===========================================================================
  precheck:
    name: Precheck (NO_BUILD / VERSION)
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.gate.outputs.build }}
      version: ${{ steps.ver.outputs.version }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check NO_BUILD sentinel
        id: gate
        run: |
          if [ -f NO_BUILD ]; then
            echo "NO_BUILD present - skipping all build/release jobs"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read VERSION and decide pre-release
        id: ver
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$version" ]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # -alpha / -beta / -bata / -dev (optionally followed by .N)
          if printf '%s' "$version" | grep -Eqi '\-(alpha|beta|bata|dev)(\.[0-9]+)?$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "VERSION=$version -> pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "VERSION=$version -> stable release"
          fi

  # ===========================================================================
  # Windows x64 (首要平台)
  # ===========================================================================
  windows:
    name: Windows x64
    needs: precheck
    if: needs.precheck.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure Ninja
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          modules: qtmultimedia
          # aqt 3.3.0 (PyPI) still assumes the pre-6.11 Windows repo
          # layout; Qt 6.11 split it into qt6_6111_msvc2022_64/.
          # Use the aqtinstall commit that adds EXTENSIONS_WIN_X64_QT6_11.
          aqtsource: https://codeload.github.com/miurahr/aqtinstall/tar.gz/5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Self test
        run: build/mrmusic_selftest.exe

      - name: Install and deploy (windeployqt)
        shell: pwsh
        run: |
          cmake --install build --prefix dist
          & "${{ env.QT_ROOT_DIR }}/bin/windeployqt.exe" --release --qmldir qml "dist/bin/MrMusic.exe"
          New-Item -ItemType Directory -Force -Path "dist/bin/data" | Out-Null
          Compress-Archive -Path dist/bin -DestinationPath MrMusic-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-windows-x64
          path: MrMusic-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Linux x64 (AppImage)
  # ===========================================================================
  linux:
    name: Linux x64
    needs: precheck
    if: needs.precheck.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libfontconfig1-dev libfreetype6-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libglib2.0-dev \
            patchelf libfuse2 file desktop-file-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          -DCMAKE_INSTALL_PREFIX=/usr
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DQT_DEPLOY_USE_PATCHELF=ON

      - name: Build
        run: cmake --build build

      - name: Self test
        run: QT_QPA_PLATFORM=offscreen build/mrmusic_selftest

      - name: Package AppImage
        run: bash scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-linux-x64-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # macOS (Apple Silicon, dmg)
  # ===========================================================================
  macos:
    name: macOS
    needs: precheck
    if: needs.precheck.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          arch: clang_64
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Self test
        run: |
          if [ -x ./build/mrmusic_selftest.app/Contents/MacOS/mrmusic_selftest ]; then
            ./build/mrmusic_selftest.app/Contents/MacOS/mrmusic_selftest
          else
            ./build/mrmusic_selftest
          fi

      - name: Package dmg (macdeployqt)
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: bash scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Android arm64 (每次 CI 都构建 —— 见 TARGET.md §10.29；仅本地开发遵守 §9.14)
  # ===========================================================================
  android:
    name: Android arm64
    needs: precheck
    if: needs.precheck.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do NOT use android-actions/setup-android@v3: it runs `sdkmanager tools`
      # internally, but current SDK images no longer ship that legacy package,
      # so the action fails with "Failed to find package 'tools'".
      # ubuntu-22.04 runners already have ANDROID_SDK_ROOT / ANDROID_HOME and
      # cmdline-tools on PATH; just install the exact NDK Qt expects.
      - name: Install NDK / platform / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install host Qt (for Qt build tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          modules: qtmultimedia
          dir: ${{ runner.temp }}/QtHost
          set-env: false
          cache: true

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          dir: ${{ runner.temp }}/QtAndroid
          set-env: false
          cache: true

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/mrmusic.keystore
          else
            keytool -genkeypair -v -keystore android/mrmusic.keystore -alias mrmusic \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass mrmusic -keypass mrmusic -dname "CN=MrMusic"
          fi

      - name: Build APK
        run: |
          export QT_HOST_PATH="${RUNNER_TEMP}/QtHost/${QT_VERSION}/gcc_64"
          export QT_ANDROID_PATH="${RUNNER_TEMP}/QtAndroid/${QT_VERSION}/android_arm64_v8a"
          bash scripts/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MrMusic-android-arm64
          path: dist/MrMusic-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # Release（每次 CI 都发版，见 TARGET.md §10.29）
  #   * 版本号 = VERSION 文件内容
  #   * VERSION 以 -alpha/-beta/-bata/-dev 结尾 -> pre-release
  #   * 说明文字 = CHANGLOG.md（兼容 CHANGELOG.md）
  # ===========================================================================
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [precheck, windows, linux, macos, android]
    if: needs.precheck.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Pick changelog file
        id: changelog
        run: |
          if [ -f CHANGLOG.md ]; then
            echo "path=CHANGLOG.md" >> "$GITHUB_OUTPUT"
          elif [ -f CHANGELOG.md ]; then
            echo "path=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGLOG.md / CHANGELOG.md found" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.precheck.outputs.version }}
          name: MrMusic ${{ needs.precheck.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          draft: false
          prerelease: ${{ needs.precheck.outputs.prerelease == 'true' }}
          files: artifacts/**
          generate_release_notes: false
